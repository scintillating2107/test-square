<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Square</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>Test Square</h1>
      <p>
        <span class="desk">Drag, scroll or use the arrow keys to move the square. Tap it for a new colour.</span>
        <span class="touch">Drag the square around the hexagon. Tap it for a new colour.</span>
      </p>
    </div>
    <button id="themeBtn">Light mode</button>
  </header>

  <main>
    <section class="stage" id="stage">
      <svg id="track"></svg>
      <dl class="keys">
        <dt><kbd>&larr;</kbd><kbd>&rarr;</kbd></dt><dd>move</dd>
        <dt><kbd>Shift</kbd>+<kbd>&rarr;</kbd></dt><dd>next corner</dd>
        <dt><kbd>Space</kbd></dt><dd>new colour</dd>
        <dt><kbd>Home</kbd></dt><dd>back to top</dd>
      </dl>
      <div class="square" id="square" tabindex="0" role="button" aria-label="Square - use arrow keys to move, space for a new colour"></div>
    </section>

    <section class="controls">
      <div class="group">
        <h2>Movement</h2>
        <div class="row">
          <button id="resetBtn">Reset</button>
          <button id="dirBtn" class="wide">Scroll: clockwise</button>
        </div>
        <div class="row">
          <label>Scroll speed <input type="range" id="speed" min="1" max="10" value="4"></label>
          <label>Hexagon size <input type="range" id="size" min="80" max="200" value="150"></label>
        </div>
      </div>

      <div class="group">
        <h2>Colour</h2>
        <div class="swatches" id="swatches"></div>
        <label class="inline">Pick your own <input type="color" id="picker" value="#e63946"></label>
        <label class="check"><input type="checkbox" id="rainbow"> Change colour at every corner</label>
      </div>

      <div class="group">
        <h2>Animation</h2>
        <label class="check"><input type="checkbox" id="spin" checked> Spin while moving</label>
        <label class="check"><input type="checkbox" id="pulse"> Pulse</label>
        <label class="check"><input type="checkbox" id="trail"> Leave a trail</label>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
